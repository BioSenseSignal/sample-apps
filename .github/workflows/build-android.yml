name: Build Android

on:
  pull_request:
    paths:
      - 'android/**'

jobs:
  android-kotlin:
    name: Android Kotlin
    runs-on: ubuntu-latest
    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
      JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Inject JFrog credentials
        run: |
          perl -i -pe 's|username = ".*"|username = "$ENV{JFROG_USERNAME}"|g;
                        s|password = ".*"|password = "$ENV{JFROG_API_KEY}"|g' \
            android/kotlin/settings.gradle
      - name: Build
        run: cd android/kotlin && ./gradlew assembleRelease

  android-java:
    name: Android Java
    runs-on: ubuntu-latest
    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
      JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Inject JFrog credentials
        run: |
          perl -i -pe 's|username = ".*"|username = "$ENV{JFROG_USERNAME}"|g;
                        s|password = ".*"|password = "$ENV{JFROG_API_KEY}"|g' \
            android/java/settings.gradle
      - name: Build
        run: cd android/java && ./gradlew assembleRelease

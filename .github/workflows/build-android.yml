name: Build Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  android-kotlin:
    name: Android Kotlin
    runs-on: runner-container
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Inject JFrog credentials
        run: |
          perl -i -pe 's|username = ".*"|username = "$ENV{ARTIFACTORY_USERNAME}"|g;
                        s|password = ".*"|password = "$ENV{ARTIFACTORY_API_KEY}"|g' \
            android/kotlin/settings.gradle
      - name: Build
        run: cd android/kotlin && ./gradlew assembleRelease

  android-java:
    name: Android Java
    runs-on: runner-container
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Inject JFrog credentials
        run: |
          perl -i -pe 's|username = ".*"|username = "$ENV{ARTIFACTORY_USERNAME}"|g;
                        s|password = ".*"|password = "$ENV{ARTIFACTORY_API_KEY}"|g' \
            android/java/settings.gradle
      - name: Build
        run: cd android/java && ./gradlew assembleRelease

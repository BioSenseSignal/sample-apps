name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  ios:
    name: iOS
    runs-on: binahai-compadre
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Install cocoapods-art and configure auth
        run: |
          gem install cocoapods-art --no-document
          printf "machine biosensesignal.jfrog.io\n  login %s\n  password %s\n" \
            "$ARTIFACTORY_USERNAME" "$ARTIFACTORY_API_KEY" >> ~/.netrc
          chmod 600 ~/.netrc
      - name: Pod install
        run: |
          mkdir -p ~/.cocoapods/repos
          cd ios
          POD_REPO_URL="https://biosensesignal.jfrog.io/artifactory/api/pods/biosensesignal-ios-cocoapods"
          pod repo-art add biosensesignal-cocoapods "$POD_REPO_URL" || \
            pod repo-art update biosensesignal-cocoapods
          pod install
      - name: Build
        run: |
          cd ios
          xcodebuild archive \
            -allowProvisioningUpdates \
            -workspace SampleApp.xcworkspace \
            -scheme SampleApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath SampleApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

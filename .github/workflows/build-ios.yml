name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
  pull_request:
    paths:
      - 'ios/**'

jobs:
  ios:
    name: iOS
    runs-on: macos-latest
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
      ARTIFACTORY_IOS_COCOAPODS_REPOSITORY: ${{ vars.ARTIFACTORY_IOS_COCOAPODS_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5
      - name: Install cocoapods-art and configure auth
        run: |
          gem install cocoapods-art --no-document
          printf "machine biosensesignal.jfrog.io\n  login %s\n  password %s\n" \
            "$ARTIFACTORY_USERNAME" "$ARTIFACTORY_API_KEY" >> ~/.netrc
          chmod 600 ~/.netrc
      - name: Pod install
        run: |
          cd ios
          POD_REPO_URL="https://biosensesignal.jfrog.io/artifactory/api/pods/$ARTIFACTORY_IOS_COCOAPODS_REPOSITORY"
          pod repo-art add biosensesignal-cocoapods "$POD_REPO_URL" || \
            pod repo-art update biosensesignal-cocoapods
          pod install
      - name: Build
        run: |
          cd ios
          xcodebuild archive \
            -allowProvisioningUpdates \
            -workspace SampleApp.xcworkspace \
            -scheme SampleApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath SampleApp.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

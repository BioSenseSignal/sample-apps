name: Build Flutter

on:
  pull_request:
    paths:
      - 'flutter/**'

jobs:
  flutter-android:
    name: Flutter Android
    runs-on: ubuntu-latest
    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
      JFROG_FLUTTER_REPOSITORY: ${{ vars.JFROG_FLUTTER_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Authenticate with JFrog
        run: |
          dart pub token add \
            "$JFROG_URL/artifactory/api/pub/$JFROG_FLUTTER_REPOSITORY" \
            --env-var JFROG_API_KEY
      - name: Build APK
        run: cd flutter/sample_app && flutter build apk

  flutter-ios:
    name: Flutter iOS
    runs-on: macos-latest
    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
      JFROG_FLUTTER_REPOSITORY: ${{ vars.JFROG_FLUTTER_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Authenticate with JFrog
        run: |
          dart pub token add \
            "$JFROG_URL/artifactory/api/pub/$JFROG_FLUTTER_REPOSITORY" \
            --env-var JFROG_API_KEY
      - name: Build IPA
        run: |
          cd flutter/sample_app
          flutter build ipa \
            --export-options-plist=/dev/null \
            --build-name=1.0.0 \
            --no-codesign

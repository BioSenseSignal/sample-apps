name: Build Flutter

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter.yml'

jobs:
  flutter-android:
    name: Flutter Android
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Authenticate with JFrog
        run: |
          dart pub token add \
            "https://biosensesignal.jfrog.io/artifactory/api/pub/biosensesignal_flutter_sdk" \
            --env-var ARTIFACTORY_API_KEY
      - name: Build APK
        run: cd flutter && flutter build apk

  flutter-ios:
    name: Flutter iOS
    runs-on: macos-latest
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Authenticate with JFrog
        run: |
          dart pub token add \
            "https://biosensesignal.jfrog.io/artifactory/api/pub/biosensesignal_flutter_sdk" \
            --env-var ARTIFACTORY_API_KEY
      - name: Install cocoapods-art and configure auth
        run: |
          gem install cocoapods-art --no-document
          printf "machine biosensesignal.jfrog.io\n  login %s\n  password %s\n" \
            "$ARTIFACTORY_USERNAME" "$ARTIFACTORY_API_KEY" >> ~/.netrc
          chmod 600 ~/.netrc
          mkdir -p ~/.cocoapods/repos
          pod repo-art add biosensesignal-cocoapods \
            "https://biosensesignal.jfrog.io/artifactory/api/pods/biosensesignal-ios-cocoapods"
      - name: Build IPA
        run: |
          cd flutter
          flutter build ipa \
            --build-name=1.0.0 \
            --no-codesign

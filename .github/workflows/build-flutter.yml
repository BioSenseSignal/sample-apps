name: Build Flutter

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
  pull_request:
    paths:
      - 'flutter/**'

jobs:
  flutter-android:
    name: Flutter Android
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
      ARTIFACTORY_FLUTTER_REPOSITORY: ${{ vars.ARTIFACTORY_FLUTTER_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Authenticate with JFrog
        run: |
          dart pub token add \
            "$ARTIFACTORY_URL/artifactory/api/pub/$ARTIFACTORY_FLUTTER_REPOSITORY" \
            --env-var ARTIFACTORY_API_KEY
      - name: Build APK
        run: cd flutter && flutter build apk

  flutter-ios:
    name: Flutter iOS
    runs-on: macos-latest
    env:
      ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
      ARTIFACTORY_FLUTTER_REPOSITORY: ${{ vars.ARTIFACTORY_FLUTTER_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Authenticate with JFrog
        run: |
          dart pub token add \
            "$ARTIFACTORY_URL/artifactory/api/pub/$ARTIFACTORY_FLUTTER_REPOSITORY" \
            --env-var ARTIFACTORY_API_KEY
      - name: Build IPA
        run: |
          cd flutter
          flutter build ipa \
            --export-options-plist=/dev/null \
            --build-name=1.0.0 \
            --no-codesign
